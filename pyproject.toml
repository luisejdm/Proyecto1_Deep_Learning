[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "proyecto1_deep_learning"
version = "0.0.1"
description = "Proyecto 1"
authors = [
  { name = "Luis Jim\u00e9nez, Santiago Reyes, Santiago Montes de Oca" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["proyecto1_deep_learning"]
include = ["pyproject.toml", "proyecto1_deep_learning/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["proyecto1_deep_learning"]
force-sort-within-sections = true

